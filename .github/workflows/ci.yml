name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit tests (no model download)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check coft scripts tests
        continue-on-error: true

      # tests/test_masking.py needs a real tokenizer and is skipped automatically
      # when the checkpoint cannot be reached; the theory, conformal and metric
      # suites are fully self-contained.
      - name: Unit tests
        run: pytest tests -q -k "not masking"

      - name: Masking tests (needs a tokenizer from the Hub)
        run: pytest tests/test_masking.py -q
        continue-on-error: true

  import-check:
    name: package imports cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
      - run: |
          python -c "
          import coft
          from coft import fusion, masking, conformal, decoding, metrics, calibration
          from coft.baselines import VanillaDecoder, SDDDecoder, DExpertsDecoder, DTCDDecoder
          print('coft', coft.__version__, 'imports OK')
          "
      - name: Scripts compile
        run: python -m compileall -q coft scripts tests
