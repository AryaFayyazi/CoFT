[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coft"
version = "1.0.0"
description = "COFT: Counterfactual-Conformal Decoding for Fair Chain-of-Thought Reasoning in Large Language Models"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Arya Fayyazi", email = "afayyazi@usc.edu" },
    { name = "Mehdi Kamal" },
    { name = "Massoud Pedram" },
]
keywords = ["conformal prediction", "fairness", "llm", "decoding", "counterfactual"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.38",
    "datasets>=2.14",
    "accelerate>=0.26",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
mauve = ["mauve-text>=0.4.0", "faiss-cpu>=1.7.4"]
ner = ["spacy>=3.7"]
dev = ["pytest>=7.4", "pytest-timeout>=2.1", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/AryaFayyazi/CoFT"
Repository = "https://github.com/AryaFayyazi/CoFT"

[tool.setuptools.packages.find]
include = ["coft*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: marks tests that load a real language model",
]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",  # long lines are handled by the formatter, not enforced
    "E741",  # `l`/`I` are never used as names here; the rule mostly fires on math symbols
    "B008",  # function calls in argument defaults are intentional in the config layer
]

[tool.ruff.lint.per-file-ignores]
# The runner scripts share helpers via sys.path manipulation before importing.
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]
